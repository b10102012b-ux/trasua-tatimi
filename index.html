<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xe Đẩy Trà Sữa</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f5f5f7; padding: 15px; color: #333; }
        h1 { text-align: center; color: #d35400; font-size: 20px; margin-bottom: 15px; }
        .section { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { font-size: 16px; margin-bottom: 10px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .btn-add { background: #e67e22; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .total { font-size: 18px; font-weight: bold; color: #e74c3c; text-align: right; margin-top: 10px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn-submit { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-top: 12px; cursor: pointer; }
        .btn-clear { background: #95a5a6; font-size: 12px; padding: 4px 8px; }
    </style>
</head>
<body>

    <h1>🧋 XE ĐẨY TRÀ SỮA</h1>

    <div class="section">
        <h2>📋 Thực Đơn</h2>
        <div id="menu"></div>
    </div>

    <div class="section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>🛒 Giỏ Hàng</h2>
            <button class="btn-add btn-clear" onclick="xoaGioHang()">Xóa tất cả</button>
        </div>
        <div id="cart-list" style="margin-top: 10px;">Chưa chọn món nào</div>
        <div class="total" id="total-price">Tổng: 0 VNĐ</div>
    </div>

    <div class="section">
        <h2>🚚 Thông Tin Giao Hàng</h2>
        <input type="text" id="cus-name" placeholder="Tên khách hàng">
        <input type="tel" id="cus-phone" placeholder="Số điện thoại">
        <textarea id="cus-address" rows="2" placeholder="Địa chỉ giao hàng"></textarea>
        <button class="btn-submit" onclick="xacNhanDon()">XÁC NHẬN ĐƠN SHIP</button>
    </div>

    <script>
        const menu = [
            { id: 1, name: "Trà sữa truyền thống", price: 20000 },
            { id: 2, name: "Trà sữa Thái xanh", price: 22000 },
            { id: 3, name: "Trà sữa Ô long", price: 25000 },
            { id: 4, name: "Trà đào cam sả", price: 25000 },
            { id: 5, name: "Trân châu đen (Thêm)", price: 5000 }
        ];

        let cart = {};

        function renderMenu() {
            const menuDiv = document.getElementById('menu');
            menuDiv.innerHTML = menu.map(item => `
                <div class="menu-item">
                    <div>
                        <strong>${item.name}</strong><br>
                        <small style="color: #7f8c8d">${item.price.toLocaleString()} VNĐ</small>
                    </div>
                    <button class="btn-add" onclick="addToCart(${item.id})">+ Thêm</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCart();
        }

        function xoaGioHang() {
            cart = {};
            updateCart();
        }

        function updateCart() {
            const cartDiv = document.getElementById('cart-list');
            const totalDiv = document.getElementById('total-price');
            let total = 0;
            let html = '';

            for (let id in cart) {
                const item = menu.find(m => m.id == id);
                const itemTotal = item.price * cart[id];
                total += itemTotal;
                html += `
                    <div class="cart-item">
                        <span>${item.name} x<b>${cart[id]}</b></span>
                        <span>${itemTotal.toLocaleString()} VNĐ</span>
                    </div>
                `;
            }

            cartDiv.innerHTML = html || 'Chưa chọn món nào';
            totalDiv.innerText = `Tổng: ${total.toLocaleString()} VNĐ`;
        }

        function xacNhanDon() {
            const name = document.getElementById('cus-name').value.trim();
            const phone = document.getElementById('cus-phone').value.trim();
            const address = document.getElementById('cus-address').value.trim();

            if (Object.keys(cart).length === 0) {
                alert("Vui lòng chọn ít nhất 1 món!");
                return;
            }
            if (!name || !phone || !address) {
                alert("Vui lòng nhập đầy đủ Tên, SĐT và Địa chỉ!");
                return;
            }

            alert(`✅ ĐÃ TẠO ĐƠN SHIP THÀNH CÔNG!\n\nKhách: ${name} - ${phone}\nĐ/c: ${address}`);
            xoaGioHang();
            document.getElementById('cus-name').value = '';
            document.getElementById('cus-phone').value = '';
            document.getElementById('cus-address').value = '';
        }

        renderMenu();
    </script>
</body>
</html>
